line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI uses Depends() in default arguments by design

[lint.isort]
known-first-party = ["app", "wellness_contracts"]
known-third-party = ["alembic"]
known-local-folder = ["conftest"]
