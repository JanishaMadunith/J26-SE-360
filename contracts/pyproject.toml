[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wellness-contracts"
version = "0.1.0"
description = "J26-SE-360 shared data contracts (single source of truth for every API between the app, core API and module services)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]
