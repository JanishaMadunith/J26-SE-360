name: wellness_app
description: >-
  J26-SE-360 — AI-Driven Cognitive Wellness Framework. Android app that collects compact raw sensor
  signals, uploads them to the core API, and shows wellness insights, adaptive schedules and meal suggestions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Versions were chosen from memory without access to pub.dev — run `flutter pub upgrade --major-versions`
# if `flutter pub get` reports a conflict, then fix any API changes it flags (see mobile/README.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  workmanager: ^0.5.2
  camera: ^0.11.0+2
  pedometer: ^4.0.2
  light: ^5.0.0
  flutter_activity_recognition: ^4.0.0
  permission_handler: ^11.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
